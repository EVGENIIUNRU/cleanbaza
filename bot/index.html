<input id="ticket" type="hidden" value="">
<header class="masthead"><div class="brandline"><span class="wordmark">BAZA<span> •</span></span><span class="release">CLEAN / 02</span></div><h1>Моя смена</h1><div id="identity" class="muted"></div></header><div id="message" role="alert" aria-live="polite"></div><main id="app"><p>Загружаем задания…</p></main>
<script>
'use strict';
const app=document.querySelector('#app');
const fromHash=new URLSearchParams(location.hash.slice(1)).get('session');
if(fromHash){sessionStorage.setItem('bazaSession',fromHash);history.replaceState(null,'',location.pathname+location.search);}
const ticket=fromHash||sessionStorage.getItem('bazaSession')||document.querySelector('#ticket').value;
const ENDPOINT='https://script.google.com/macros/s/AKfycbysC5d5PaP-NLdrQrctK4GsAvduyCjeXj1YsWXFQnnL7f33NZY4cLfIExW5xdblWyA/exec';
let state,filter='now',selected,capture,stream,photoCount=0,busy=false,uploads=Promise.resolve(),pending=0;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const when=t=>new Intl.DateTimeFormat('ru-RU',{timeZone:'Asia/Vladivostok',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(t);
function message(text=''){document.querySelector('#message').textContent=text;}
function jsonp(params){return new Promise((resolve,reject)=>{const name='baza_'+crypto.randomUUID().replaceAll('-','');const script=document.createElement('script');const url=new URL(ENDPOINT);for(const [k,v] of Object.entries({...params,session:ticket,callback:name}))url.searchParams.set(k,v);let timer;const cleanup=()=>{clearTimeout(timer);script.remove();delete window[name];};window[name]=data=>{cleanup();resolve(data);};script.onerror=()=>{cleanup();reject(new Error('Не удалось связаться с Apps Script'));};timer=setTimeout(()=>{cleanup();reject(new Error('Сервер не ответил. Проверьте соединение и обновите задания.'));},30000);script.src=url.href;document.head.append(script);});}
async function rpc(op,p={}){
 if(window.google?.script?.run)return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||'Нет связи с сервером'))).api(op,ticket,p));
 if(!ticket||ticket.includes('<?'))throw new Error('Откройте /start в @Chek_Baza_bot и нажмите «Открыть задания».');
 let result;
 if(['state','photo','adminState','adminCatalog','adminPoints','myPoints','bootstrap'].includes(op))result=await jsonp({op,payload:JSON.stringify(p)});
 else{
  const request=crypto.randomUUID();
  await fetch(ENDPOINT,{method:'POST',mode:'no-cors',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({op,ticket,payload:p,request})});
  for(let i=0;i<15;i++){result=await jsonp({action:'result',request});if(!result.pending)break;await new Promise(r=>setTimeout(r,2000));}
 }
 if(result?.pending)throw new Error('Подтверждение задерживается. Обновите задания перед повторной отправкой.');
 if(!result?.ok)throw new Error(result?.error||'Ошибка сервера');return result.value;
}
async function action(fn){if(busy)return;busy=true;message();try{await fn();}catch(e){message(e.message);if(!state){app.replaceChildren(el('p','Не удалось загрузить смену.','notice'),button('Повторить загрузку',refresh,'primary'));}}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function button(text,fn,cls=''){const b=el('button',text,cls);b.onclick=()=>{if(busy)return;b.disabled=true;action(fn);};return b;}
function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;}
async function refresh(){stopCamera();if(state?.user.role==='owner'&&cabinet){await openCabinet();return;}if(!state){const data=await rpc('bootstrap');state=data.state||{user:data.user};if(data.admin){adminData=data.admin;adminStart=adminData.shift.start;cabinet=true;document.body.classList.add('cabinet');document.querySelector('h1').textContent='Кабинет руководителя';document.querySelector('#identity').textContent=state.user.name;renderCabinet();return;}}else state=await rpc('state');document.querySelector('#identity').textContent=state.user.name+' · '+state.shift.name+' '+when(state.shift.start);if(state.user.role==='owner'&&cabinet){await openCabinet();return;}renderList();}
function taskCard(t){
 const future=t.open>state.now,late=!future&&t.due<state.now,c=el('section',undefined,'task-row'+(future?' is-planned':late?' is-late':''));
 const icon=el('span',t.taskId==='CLN-012'?'⌨':t.taskId==='CLN-017'?'▣':t.taskId==='CLN-006'?'◈':t.bonus?'✦':'◇','task-icon');icon.setAttribute('aria-hidden','true');
 const main=el('div',undefined,'task-main');main.append(el('h2',t.title),el('div',t.object,'task-object'),el('p',t.steps.length+' пунктов · '+t.photoCount+' фото','muted'));
 if(late)main.append(el('p','Срок прошёл — выполните при первой возможности','late'));
 const foot=el('div',undefined,'task-foot');foot.append(el('span',future?'Откроется '+when(t.open):'До '+when(t.due),'badge'));
 if(!future)foot.append(button('Выполнить',()=>showTask(t),'primary'));
 main.append(foot);c.append(icon,main);return c;
}
function renderList(){
 selected=null;capture=null;app.replaceChildren();document.querySelector('h1').textContent='Моя смена';
 if(state.user.role==='owner')app.append(button('Кабинет руководителя',openCabinet));
 renderShiftStart();
 const nav=el('nav');[['now','Моя смена'],['late','Прошлые'],['history','Отчёты']].concat(state.user.role==='owner'?[['review','На проверке']]:[]).forEach(([key,label])=>nav.append(button(label,()=>{filter=key;renderList();},filter===key?'active':'')));app.append(nav);
 if(filter==='history'||filter==='review'){
  const reports=state.reports.filter(r=>filter!=='review'||r.status==='Отчёт отправлен');
  reports.forEach(r=>{const c=el('section',undefined,'card');c.append(el('h2',r.title+' · '+r.object),el('p',r.name+' · '+when(r.at)),el('span',r.status,'badge'),button('Посмотреть фотоотчёт',()=>showReport(r)));app.append(c);});
  if(!reports.length)app.append(el('p','Отчётов пока нет','empty'));
 }else{
  const unfinished=t=>!['Принято','Отчёт отправлен','Снято с плана'].includes(t.status);
  const current=state.tasks.filter(t=>t.shiftStart===state.shift.start),todo=current.filter(unfinished).sort((a,b)=>a.due-b.due);
  if(filter==='late'){
   const old=state.tasks.filter(t=>t.shiftStart<state.shift.start&&unfinished(t)).sort((a,b)=>b.due-a.due);
   app.append(el('h2','Передано из прошлых смен'),el('p','Это отдельный список. Сначала выполните обязательные проверки своей смены.','notice'));
   old.slice(0,30).forEach(t=>app.append(taskCard(t)));if(state.carriedCount>30)app.append(el('p','Показаны 30 последних из '+state.carriedCount+'. Полная история доступна руководителю.','muted'));if(!old.length)app.append(el('p','Переходящих заданий нет','empty'));
  }else{
   const submitted=current.filter(t=>['Принято','Отчёт отправлен'].includes(t.status)).length;
   const progress=el('section',undefined,'card shift-progress');progress.append(el('strong','Сдано '+submitted+' из '+current.length),el('p','До конца смены: '+when(state.shift.end),'muted'));const bar=el('progress');bar.max=current.length||1;bar.value=submitted;progress.append(bar);app.append(progress);
   if(!state.assignment)app.append(el('p','1. Начните смену выше. 2. Выполните первые проверки. 3. Отметьте все пункты и отправьте свежие фото.','notice'));
   const open=todo.filter(t=>t.open<=state.now),first=open.filter(t=>t.due<=state.now+3600000||(['CLN-006','CLN-017'].includes(t.taskId)&&t.open===state.shift.start));
   app.append(el('h2','Сделать сначала'),el('p','Ближайшие сроки, санузел и холодильники при начале смены.','muted'));
   (first.length?first:open.slice(0,1)).forEach(t=>app.append(taskCard(t)));
   if(!open.length)app.append(el('p',todo.length?'Сейчас всё сдано. Следующие проверки — ниже.':'Все задания смены отправлены на проверку.','good'));
   const shown=new Set((first.length?first:open.slice(0,1)).map(t=>t.id)),rest=todo.filter(t=>!shown.has(t.id));
   if(rest.length){const more=el('details',undefined,'card');more.append(el('summary','Остальное на смену · '+rest.length));rest.forEach(t=>more.append(taskCard(t)));app.append(more);}
   app.append(button('После гостя · убрать место',showEvent),button('Мои баллы за смену',showMyPoints));
   renderSuperClean();
  }
 }
 app.append(button('Обновить задания',refresh));
}
function renderSuperClean(){
 const c=el('section',undefined,'card super-clean'),existing=state.tasks.find(t=>t.roulette&&t.shiftStart===state.shift.start);
 c.append(el('span','ДОБРОВОЛЬНЫЙ БОНУС','brand'),el('h2','🎲 Рулетка суперуборки'),el('p','Один случайный участок за смену. +'+state.extraPoints+' баллов после принятия фотоотчёта. За невыполнение штрафа нет.','muted'));
 if(existing){c.append(el('p',existing.title),el('p',existing.status,'badge'));if(!['Принято','Отчёт отправлен'].includes(existing.status))c.append(button('Открыть суперуборку',()=>showTask(existing)));}
 else if(state.assignment?.user===state.user.id)c.append(button('Выбрать суперуборку',async()=>{message('Выбираем участок…');const task=await rpc('superClean',{start:state.shift.start});state.tasks.push(task);message();await showTask(task);},'primary'));
 else c.append(el('p','Доступна сотруднику, который начал смену.','muted'));app.append(c);
}
async function showTask(t){
 stopCamera();selected=t;capture=null;photoCount=0;uploads=Promise.resolve();pending=0;app.replaceChildren();

let pointData;
function appendPointRows(score,container){
 const grid=el('div',undefined,'admin-grid');score.rows.forEach(r=>{const c=el('section',undefined,'card');c.append(el('strong',(r.points>0?'+':'')+r.points+' баллов'),el('h2',r.title),el('p',r.object),el('p',r.status,'muted'));if(r.performer)c.append(el('small','Отчёт: '+r.performer));grid.append(c);});container.append(grid);
 score.adjustments?.forEach(a=>{const c=el('section',undefined,'card');c.append(el('strong',(a.amount>0?'+':'')+a.amount+' · корректировка'),el('p',a.reason),el('small',when(a.at)));container.append(c);});
}
async function showMyPoints(){
 const score=await rpc('myPoints');app.replaceChildren();app.append(button('← К заданиям',()=>renderList()),el('h2','Мои баллы за смену'));
 app.append(el('p',score.assignment?'Ответственный: '+score.assignment.name:'Ответственный пока не назначен'));
 if(score.reason)app.append(el('p',score.reason,'notice'));
 if(!score.assignment)app.append(button('Начать смену',beginShift,'primary'));
 if(score.total!==null&&score.total!==undefined){app.append(metric('Текущий результат',score.total),el('p','На проверке: '+score.pending+'. Баллы изменятся после решения руководителя.','notice'));appendPointRows(score,app);}
}
function renderPoints(){
 if(!pointData){app.append(button('Загрузить баллы',async()=>{pointData=await rpc('adminPoints',{start:adminStart});renderCabinet();}));return;}
 const d=pointData,s=d.score,st=d.shift.start;
 app.append(el('h2','Учёт баллов: '+d.shift.name+' · '+when(st)),el('p','Один ответственный за смену. Баллы — основание для вашего решения о премии; выплаты автоматически не рассчитываются.','notice'));
 app.append(button('Назначить ответственного на следующую смену',async()=>{pointData=await rpc('adminPoints',{start:d.nextStart});renderCabinet();}));
 if(s.reason)app.append(el('p',s.reason,'notice'));
 if(s.enabledAt)app.append(el('p','Начало учёта: '+when(s.enabledAt)+'. Более ранние смены не штрафуются.','muted'));
 if(s.assignment)app.append(el('h2','Ответственный: '+s.assignment.name));
 if(s.total!==null){const totals=el('div',undefined,'metrics');totals.append(metric('Итого баллов',s.total),metric('За задания',s.base),metric('Отчётов на проверке',s.pending));app.append(totals);}
 const assignment=el('section',undefined,'card'),person=el('select'),reason=el('input');
 d.staff.forEach(u=>{const o=el('option',u.name);o.value=u.id;person.append(o);});if(s.assignment)person.value=s.assignment.user;person.setAttribute('aria-label','Ответственный сотрудник');reason.placeholder='Причина замены или назначения за прошедшую смену';
 assignment.append(el('h2','Ответственный за эту смену'),person,reason,button('Сохранить ответственного',async()=>{await rpc('adminAssign',{start:st,user:person.value,reason:reason.value});pointData=await rpc('adminPoints',{start:st});renderCabinet();message('Ответственный сохранён.');}));app.append(assignment);
 const rules=el('details',undefined,'card');rules.append(el('summary','Настроить стоимость заданий · со следующей смены'));const inputs={};
 [['regular','Принятое плановое задание'],['extra','Принятое дополнительное'],['penalty','Списание за невыполненное плановое']].forEach(([key,label])=>{const wrap=el('label',label),input=el('input');input.type='number';input.min=0;input.max=1000;input.value=d.nextRules[key];inputs[key]=input;wrap.append(input);rules.append(wrap);});rules.append(el('p','Новые значения действуют с '+when(d.rulesAt)+'. Ожидание проверки и невыполненные допзадания — без штрафа.','muted'),button('Сохранить правила баллов',async()=>{await rpc('adminPointRules',Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value])));pointData=await rpc('adminPoints',{start:st});renderCabinet();message('Правила баллов сохранены со следующей смены.');}));app.append(rules);
 if(s.assignment){
  const correction=el('details',undefined,'card');correction.append(el('summary','Корректировка баллов с объяснением'));const amount=el('input'),why=el('textarea');amount.type='number';amount.placeholder='Например: 10 или -10';why.placeholder='Причина обязательна: замена, технический сбой, согласованное исключение';correction.append(amount,why,button('Записать корректировку',async()=>{await rpc('adminPointAdjustment',{start:st,amount:amount.value,reason:why.value});pointData=await rpc('adminPoints',{start:st});renderCabinet();message('Корректировка записана в журнал.');}));app.append(correction);
  if(st===adminData.latest){const extra=el('details',undefined,'card');extra.append(el('summary','Согласовать дополнительное задание'));const title=el('input'),steps=el('textarea'),photos=el('input'),standard=el('textarea');title.placeholder='Что сделать';steps.placeholder='Подпункты — по одному на строке';photos.type='number';photos.min=0;photos.max=6;photos.value=1;standard.placeholder='Ожидаемый результат';extra.append(title,steps,el('label','Обязательных фото'),photos,standard,button('Выдать допзадание до конца смены',async()=>{await rpc('adminExtraTask',{start:st,title:title.value,steps:steps.value,photos:photos.value,standard:standard.value});await openCabinet();message('Допзадание выдано. Баллы начислятся после принятия отчёта.');},'primary'));app.append(extra);}
 }
 app.append(el('h2','За что начислены и сняты баллы'));appendPointRows(s,app);
 if(!s.rows.length)app.append(el('p','Начислений по заданиям пока нет.','muted'));
}

action(refresh);
</script></body></html>
