<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAZA — контроль чистоты</title><meta name="referrer" content="no-referrer"><base target="_top">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#12141c;color:#f2f4fa}*{box-sizing:border-box}body{margin:0;padding:20px 16px 90px;max-width:660px;margin-inline:auto}h1{font-size:28px;margin:8px 0}h2{font-size:20px}p{line-height:1.5}small,.muted{color:#a8afc4}.brand{font-size:12px;letter-spacing:.2em;color:#8fb5ff}.card{background:#202434;border:1px solid #30364a;border-radius:22px;padding:18px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{border-radius:20px;padding:5px 9px;font-size:12px;background:#313951;white-space:nowrap}.late{color:#ffbd93}.good{color:#9cdeb5}button,select,textarea{font:inherit;width:100%;border:0;border-radius:16px;padding:15px;background:#303a57;color:#fff}button{cursor:pointer;min-height:50px;margin-top:10px;text-align:left}button.primary{background:#347cf4;text-align:center;font-weight:650}button.danger{background:#62383c}button:disabled{opacity:.45;cursor:wait}nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}nav button{width:auto;flex:1;font-size:14px;padding:12px;text-align:center}nav button.active{background:#347cf4}label.check{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #343a4c;line-height:1.45}input[type=checkbox]{width:23px;height:23px;flex-shrink:0;accent-color:#4089ff}textarea{min-height:88px;resize:vertical;margin-top:12px}video{width:100%;border-radius:18px;background:#080a10;max-height:55vh}img{width:100%;border-radius:14px;margin-top:10px}.notice{border-left:3px solid #74a6ff;padding:12px;background:#252c40;border-radius:6px;line-height:1.5}#message{position:sticky;top:8px;z-index:5;padding:12px;background:#56383b;border-radius:12px;white-space:pre-wrap}#message:empty{display:none}.shotgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolbar{display:flex;gap:8px}.toolbar button{flex:1;text-align:center}.empty{padding:35px 15px;text-align:center;color:#a8afc4}
body.cabinet{max-width:1280px}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{display:flex;flex-direction:column;gap:8px}.metric strong{font-size:36px}.metric span{color:#a8afc4}.filters,.editor-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}input:not([type=checkbox]):not([type=hidden]){font:inherit;width:100%;padding:14px;border:1px solid #39445b;border-radius:12px;background:#202434;color:#fff}label select,label input,label textarea{display:block;margin-top:8px}label{line-height:1.5}summary{cursor:pointer;padding:12px 0}.cabinet .toolbar{flex-wrap:wrap}.toolbar>input,.toolbar>select{flex:1;min-width:140px}.admin-grid img{object-fit:contain;max-height:80vh}.editor-form textarea{min-height:140px}
</style></head><body>
<input id="ticket" type="hidden" value="">
<div class="brand">BAZA / КОНТРОЛЬ ЧИСТОТЫ</div><h1>Моя смена</h1><div id="identity" class="muted"></div><div id="message" role="alert" aria-live="polite"></div><main id="app"><p>Загружаем задания…</p></main>
<script>
'use strict';
const app=document.querySelector('#app');
const fromHash=new URLSearchParams(location.hash.slice(1)).get('session');
if(fromHash){sessionStorage.setItem('bazaSession',fromHash);history.replaceState(null,'',location.pathname+location.search);}
const ticket=fromHash||sessionStorage.getItem('bazaSession')||document.querySelector('#ticket').value;
const ENDPOINT='https://script.google.com/macros/s/AKfycbysC5d5PaP-NLdrQrctK4GsAvduyCjeXj1YsWXFQnnL7f33NZY4cLfIExW5xdblWyA/exec';
let state,filter='now',selected,capture,stream,photoCount=0,busy=false;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const when=t=>new Intl.DateTimeFormat('ru-RU',{timeZone:'Asia/Vladivostok',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(t);
function message(text=''){document.querySelector('#message').textContent=text;}
function jsonp(params){return new Promise((resolve,reject)=>{const name='baza_'+crypto.randomUUID().replaceAll('-','');const script=document.createElement('script');const url=new URL(ENDPOINT);for(const [k,v] of Object.entries({...params,session:ticket,callback:name}))url.searchParams.set(k,v);let timer;const cleanup=()=>{clearTimeout(timer);script.remove();delete window[name];};window[name]=data=>{cleanup();resolve(data);};script.onerror=()=>{cleanup();reject(new Error('Не удалось связаться с Apps Script'));};timer=setTimeout(()=>{cleanup();reject(new Error('Сервер не ответил. Проверьте соединение и обновите задания.'));},30000);script.src=url.href;document.head.append(script);});}
async function rpc(op,p={}){
 if(window.google?.script?.run)return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||'Нет связи с сервером'))).api(op,ticket,p));
 if(!ticket||ticket.includes('<?'))throw new Error('Откройте /start в @Chek_Baza_bot и нажмите «Открыть задания».');
 let result;
 if(['state','photo','adminState','adminCatalog','adminPoints','myPoints'].includes(op))result=await jsonp({op,payload:JSON.stringify(p)});
 else{
  const request=crypto.randomUUID();
  await fetch(ENDPOINT,{method:'POST',mode:'no-cors',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({op,ticket,payload:p,request})});
  for(let i=0;i<15;i++){result=await jsonp({action:'result',request});if(!result.pending)break;await new Promise(r=>setTimeout(r,2000));}
 }
 if(result?.pending)throw new Error('Подтверждение задерживается. Обновите задания перед повторной отправкой.');
 if(!result?.ok)throw new Error(result?.error||'Ошибка сервера');return result.value;
}
async function action(fn){if(busy)return;busy=true;message();try{await fn();}catch(e){message(e.message);}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function button(text,fn,cls=''){const b=el('button',text,cls);b.onclick=()=>{if(busy)return;b.disabled=true;action(fn);};return b;}
function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;}
async function refresh(){stopCamera();state=await rpc('state');document.querySelector('#identity').textContent=state.user.name+' · '+state.shift.name+' '+when(state.shift.start);if(state.user.role==='owner'&&cabinet){await openCabinet();return;}renderList();}
function renderList(){
 selected=null;capture=null;app.replaceChildren();if(state.user.role==='owner')app.append(button('Кабинет руководителя',openCabinet,'primary'));
 renderShiftStart();
 app.append(button('Мои баллы за смену',showMyPoints));
 const nav=el('nav');[['now','Сейчас'],['late','Просрочено'],['history','История']].concat(state.user.role==='owner'?[['review','На проверке']]:[]).forEach(([key,label])=>nav.append(button(label,async()=>{filter=key;renderList();},filter===key?'active':'')));app.append(nav);
 if(filter==='history'||filter==='review'){
  const reports=state.reports.filter(r=>filter!=='review'||r.status==='Отчёт отправлен');
  reports.forEach(r=>{const card=el('section',undefined,'card');card.append(el('strong',r.title+' · '+r.object),el('p',r.name+' · '+when(r.at)),el('span',r.status,'badge'));card.append(button('Открыть отчёт',()=>showReport(r)));app.append(card);});
  if(!reports.length)app.append(el('p','Отчётов пока нет','empty'));
 }else{
  const tasks=state.tasks.filter(t=>!['Принято','Отчёт отправлен'].includes(t.status)&&(filter!=='late'||t.due<state.now));
  tasks.sort((a,b)=>a.due-b.due);
  app.append(el('p','Открыто: '+tasks.length+' · время Владивостока','muted'));
  tasks.forEach(t=>{const c=el('section',undefined,'card');const row=el('div',undefined,'row');row.append(el('strong',t.object),el('span',t.due<state.now?'Просрочено':when(t.due),'badge '+(t.due<state.now?'late':'')));c.append(row,el('h2',t.title),el('small',t.status+' · '+t.steps.length+' пунктов · фото: '+t.photoCount));c.append(button('Открыть задание',()=>showTask(t),'primary'));app.append(c);});
  if(!tasks.length)app.append(el('p','Все текущие задания отправлены или приняты','empty'));
  if(filter==='now')app.append(button('После гостя · новое задание',showEvent));
 }
 app.append(button('Обновить',refresh));
}
async function showTask(t){
 stopCamera();selected=t;capture=null;photoCount=0;app.replaceChildren();
 app.append(button('‹ Назад',async()=>{stopCamera();renderList();}));
 app.append(el('h2',t.title),el('p',t.object+' · срок '+when(t.due),'muted'));
 const standard=el('div',t.standard,'notice');app.append(standard);
 const checks=el('section',undefined,'card');
 t.steps.forEach((s,i)=>{const label=el('label',undefined,'check'),box=el('input');box.type='checkbox';box.id='check'+i;label.append(box,el('span',s));checks.append(label);});app.append(checks);
 if(t.note)app.append(el('p',t.note,'muted'));
 const note=el('textarea');note.id='note';note.placeholder='Комментарий, недостача или передача смены';note.maxLength=1500;app.append(note);
 const progress=el('p','Фото: 0 / '+t.photoCount);progress.id='progress';app.append(progress);
 const camera=el('section');camera.id='camera';app.append(camera);
 const gallery=el('div',undefined,'shotgrid');gallery.id='shots';app.append(gallery);
 app.append(button('📷 Открыть камеру',openCamera,'primary'));
 app.append(button('Отправить отчёт',async()=>{
   const checked=t.steps.map((_,i)=>document.querySelector('#check'+i).checked);
   if(checked.some(x=>!x))throw new Error('Отметьте каждый подпункт');
   if(photoCount<t.photoCount)throw new Error('Добавьте все обязательные фото');
   if(!capture)capture=await rpc('start',{id:t.id});
   await rpc('submit',{capture:capture.id,checked,note:note.value});
   stopCamera();await refresh();message('Отчёт сохранён и поставлен на отправку руководителю. Ожидает проверки.');
 },'primary'));
 app.append(button('Есть проблема',async()=>{if(!note.value.trim())throw new Error('Опишите проблему в комментарии');await rpc('problem',{id:t.id,note:note.value});message('Проблема зарегистрирована. Задание не закрыто.');},'danger'));
}
async function openCamera(){
 if(!navigator.mediaDevices?.getUserMedia)throw new Error('Камера недоступна в этом клиенте. Откройте ссылку на телефоне. Галерея для отчётов отключена.');
 stopCamera();
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1600}},audio:false});}
 catch(e){throw new Error('Не удалось открыть камеру. Разрешите доступ в настройках. Если Telegram или Apps Script блокирует камеру — сообщите руководителю; отчёт не будет закрыт без фото.');}
 if(!capture){try{capture=await rpc('start',{id:selected.id});}catch(e){stopCamera();throw e;}}
 const area=document.querySelector('#camera');area.replaceChildren();
 const video=el('video');video.autoplay=true;video.muted=true;video.playsInline=true;video.srcObject=stream;area.append(video);await video.play();
 area.append(button('Сделать снимок',async()=>{
   if(!video.videoWidth)throw new Error('Камера ещё запускается');
   const canvas=document.createElement('canvas'),ratio=Math.min(1,1600/video.videoWidth);canvas.width=Math.round(video.videoWidth*ratio);canvas.height=Math.round(video.videoHeight*ratio);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
   const image=canvas.toDataURL('image/jpeg',.78);const result=await rpc('upload',{capture:capture.id,image});
   photoCount=result.count;document.querySelector('#progress').textContent='Фото сохранено: '+photoCount+' / '+selected.photoCount;
   const preview=el('img');preview.src=image;preview.alt='Снимок '+photoCount;document.querySelector('#shots').append(preview);
 },'primary'));
 area.append(button('Выключить камеру',async()=>{stopCamera();area.replaceChildren();}));
}
async function showReport(r){
 app.replaceChildren();app.append(button('‹ Назад',async()=>renderList()),el('h2',r.title),el('p',r.object+' · '+r.name+' · '+when(r.at)),el('p',r.note||'Без комментария'));
 app.append(el('p',r.status,'badge'));
 for(let i=0;i<r.photos.length;i++){const img=el('img');img.alt='Фотоотчёт '+(i+1);img.src=await rpc('photo',{report:r.id,index:i});app.append(img);}
 if(state.user.role==='owner'&&r.status==='Отчёт отправлен'){
   const note=el('textarea');note.placeholder='Что нужно исправить';app.append(note);
   for(const status of ['Принято','Нужна доработка'])app.append(button(status,async()=>{await rpc('review',{id:r.id,status,note:note.value});await refresh();},status==='Принято'?'primary':'danger'));
 }
}
async function showEvent(){
 app.replaceChildren();app.append(button('‹ Назад',async()=>renderList()),el('h2','Уборка после гостя'));
 const task=el('select'),object=el('select');
 state.eventTasks.forEach(t=>{const o=el('option',t.title);o.value=t.id;task.append(o);});
 state.objects.forEach(t=>{const o=el('option',t.name);o.value=t.id;object.append(o);});app.append(task,el('p','Компьютерное место'),object);
 app.append(button('Создать задание',async()=>{const r=await rpc('event',{task:task.value,object:object.value});state=await rpc('state');await showTask(state.tasks.find(t=>t.id===r.id));},'primary'));
}
window.addEventListener('pagehide',stopCamera);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCamera();});
let cabinet=true,adminTab='overview',adminData,adminStart,adminCatalog,adminEmployee='',adminStatus='',adminZone='',adminPage=0;
async function openCabinet(){
 stopCamera();cabinet=true;document.body.classList.add('cabinet');document.querySelector('h1').textContent='Кабинет руководителя';
 adminData=await rpc('adminState',adminStart===undefined?{}:{start:adminStart});adminStart=adminData.shift.start;if(adminTab==='points')pointData=await rpc('adminPoints',{start:adminStart});renderCabinet();
}
function ownerHeader(){
 app.replaceChildren();const top=el('div',undefined,'toolbar');
 top.append(button('← Смена',async()=>{if(adminStart<=adminData.earliest)return;adminStart-=12*3600000;adminPage=0;await openCabinet();}),button('Текущая смена',async()=>{adminStart=undefined;adminPage=0;await openCabinet();}),button('Смена →',async()=>{if(adminStart>=adminData.latest)return;adminStart+=12*3600000;adminPage=0;await openCabinet();}));app.append(top);
 app.append(el('h2',adminData.shift.name+' · '+when(adminStart)+' — '+when(adminData.shift.end)),el('p','Время Владивостока. Ночная смена относится к дате её начала.','muted'));
 const jump=el('div',undefined,'toolbar'),day=el('input'),type=el('select');day.type='date';day.value=adminData.shift.day;day.setAttribute('aria-label','Дата смены');
 ['Дневная','Ночная'].forEach(x=>{const o=el('option',x);type.append(o);});type.value=adminData.shift.name;type.setAttribute('aria-label','Тип смены');jump.append(day,type,button('Показать',async()=>{const target=Date.parse(day.value+'T'+(type.value==='Дневная'?'10':'22')+':00:00+10:00');if(!Number.isFinite(target))throw new Error('Выберите дату');adminStart=target;adminPage=0;await openCabinet();}));app.append(jump);
 const nav=el('nav');[['overview','Обзор'],['photos','Фотоотчёты'],['tasks','Задания смены'],['carry','Переходящие'],['editor','Редактор'],['points','Баллы']].forEach(([key,label])=>nav.append(button(label,async()=>{adminTab=key;adminPage=0;if(key==='editor')adminCatalog=await rpc('adminCatalog');if(key==='points')pointData=await rpc('adminPoints',{start:adminStart});renderCabinet();},adminTab===key?'active':'')));app.append(nav);
}
function metric(label,value){const c=el('section',undefined,'card metric');c.append(el('strong',String(value)),el('span',label));return c;}
function renderCabinet(){
 ownerHeader();const d=adminData;
 if(adminTab==='overview'){
  const grid=el('div',undefined,'metrics');grid.append(metric('Заданий смены',d.tasks.length),metric('Принято',d.tasks.filter(t=>t.status==='Принято').length),metric('На проверке',d.tasks.filter(t=>t.status==='Отчёт отправлен').length),metric('Не сдано / доработка',d.tasks.filter(t=>!['Принято','Отчёт отправлен'].includes(t.status)).length));app.append(grid);
  app.append(el('p','Статусы актуальны на момент обновления. «Отчёт отправлен» означает, что проверка руководителем ещё не завершена.','notice'));
  const zones={};d.tasks.forEach(t=>{const z=t.zone||'Без зоны';(zones[z]??=[]).push(t);});const grid2=el('div',undefined,'admin-grid');
  Object.entries(zones).forEach(([zone,list])=>{const c=el('section',undefined,'card');c.append(el('h2',zone),el('p',list.filter(t=>t.status==='Принято').length+' принято из '+list.length),button('Посмотреть задания',()=>{adminZone=zone;adminTab='tasks';renderCabinet();}));grid2.append(c);});app.append(grid2);
  app.append(el('p','Переходящих заданий: '+d.carried.length+' · Сообщений о проблемах: '+d.problems.length,'muted'));
  d.problems.forEach(p=>{const c=el('section',undefined,'card');c.append(el('strong',p.name+' · '+when(p.at)),el('p',p.note));app.append(c);});
 }else if(adminTab==='photos')renderAdminPhotos();
 else if(adminTab==='editor')renderEditor();
 else if(adminTab==='points')renderPoints();
 else renderAdminTasks(adminTab==='carry'?d.carried:d.tasks);
 const bottom=el('div',undefined,'toolbar');bottom.append(button('Обновить',openCabinet),button('Excel этой смены в группу',async()=>{await rpc('adminExport',{start:adminStart});message('Excel поставлен в очередь отправки в группу.');}),button('Режим сотрудника',()=>{cabinet=false;document.body.classList.remove('cabinet');document.querySelector('h1').textContent='Моя смена';renderList();}));app.append(bottom);
}
function selectFilter(label,values,value,onchange){const wrap=el('label',label),select=el('select');['',...values].forEach(x=>{const o=el('option',x||'Все');o.value=x;select.append(o);});select.value=value;select.onchange=()=>{onchange(select.value);adminPage=0;renderCabinet();};wrap.append(select);return wrap;}
function renderAdminTasks(list){
 const zones=[...new Set(list.map(t=>t.zone||'Без зоны'))];app.append(selectFilter('Зона',zones,adminZone,x=>adminZone=x));
 const filtered=list.filter(t=>!adminZone||(t.zone||'Без зоны')===adminZone);app.append(el('p',filtered.length+' заданий. Будущие сроки и задания без отчёта видны отдельно.','muted'));
 const grid=el('div',undefined,'admin-grid');filtered.forEach(t=>{const c=el('section',undefined,'card');c.append(el('span',t.status,'badge'),el('h2',t.title),el('p',t.object+' · срок '+when(t.due)),el('small','Создано для '+t.shift+' · '+t.day));const details=el('details');details.append(el('summary','Подпункты · '+t.steps.length));t.steps.forEach(s=>details.append(el('p','• '+s)));c.append(details);grid.append(c);});app.append(grid);if(!filtered.length)app.append(el('p','Заданий с такими условиями нет.','empty'));
}
function renderAdminPhotos(){
 const all=adminData.reports,filters=el('div',undefined,'filters');filters.append(selectFilter('Сотрудник',[...new Set(all.map(r=>r.name))],adminEmployee,x=>adminEmployee=x),selectFilter('Статус',['Отчёт отправлен','Принято','Нужна доработка'],adminStatus,x=>adminStatus=x));app.append(filters);
 const list=all.filter(r=>(!adminEmployee||r.name===adminEmployee)&&(!adminStatus||r.status===adminStatus));app.append(el('p','Найдено: '+list.length+' · отчёты заданий смены и отправленные в её период','muted'));
 const grid=el('div',undefined,'admin-grid');list.slice(adminPage*12,adminPage*12+12).forEach(r=>{const c=el('section',undefined,'card');c.append(el('span',r.status,'badge'),el('h2',r.title),el('p',r.object+' · '+r.name),el('small',when(r.at)+' · '+r.photos.length+' фото'),el('p',r.note||'Без комментария'));if(r.reviewNote)c.append(el('p','Проверка: '+r.reviewNote,'notice'));c.append(button('Фотографии и проверка',()=>showAdminReport(r),'primary'));grid.append(c);});app.append(grid);
 if(!list.length)app.append(el('p','Фотоотчётов с такими условиями нет.','empty'));
 if(list.length>12){const row=el('div',undefined,'toolbar');row.append(button('← Предыдущие',()=>{adminPage=Math.max(0,adminPage-1);renderCabinet();}),el('p',(adminPage+1)+' / '+Math.ceil(list.length/12)),button('Следующие →',()=>{adminPage=Math.min(Math.ceil(list.length/12)-1,adminPage+1);renderCabinet();}));app.append(row);}
}
async function showAdminReport(r){
 app.replaceChildren();app.append(button('← К отчётам смены',()=>renderCabinet()),el('h2',r.title),el('p',r.object+' · '+r.name+' · '+when(r.at)),el('span',r.status,'badge'),el('p',r.note||'Без комментария'));
 const checks=el('section',undefined,'card');r.steps.forEach((s,i)=>checks.append(el('p',(r.checked[i]?'✓ ':'□ ')+s)));app.append(checks);
 const gallery=el('div',undefined,'admin-grid');app.append(gallery);
 for(let i=0;i<r.photos.length;i++){const img=el('img');img.alt=r.object+' · фото '+(i+1);img.src=await rpc('photo',{report:r.id,index:i});gallery.append(img);}
 if(!r.photos.length)app.append(el('p','Для этого задания фото не требовалось.','muted'));
 if(r.status==='Отчёт отправлен'){
  const note=el('textarea');note.placeholder='Комментарий к проверке; обязателен при возврате';note.maxLength=1000;app.append(note);
  const row=el('div',undefined,'toolbar');['Принято','Нужна доработка'].forEach(status=>row.append(button(status,async()=>{await rpc('review',{id:r.id,status,note:note.value});adminTab='photos';await openCabinet();message('Решение сохранено.');},status==='Принято'?'primary':'danger')));app.append(row);
 }else app.append(el('p',r.reviewNote||'Отчёт уже проверен','notice'));
}
function renderEditor(){
 if(!adminCatalog){app.append(button('Загрузить настройки',async()=>{adminCatalog=await rpc('adminCatalog');renderCabinet();}));return;}
 app.append(el('p','Изменения вступят в силу '+when(adminCatalog.effectiveAt)+'. Уже выданные задания и история сохраняются. Для изменённых здесь заданий настройки кабинета имеют приоритет над листом «Задачи».','notice'));
 const preview=el('div',undefined,'metrics');[adminCatalog.preview,adminCatalog.nextPreview].forEach(p=>preview.append(metric(p.shift.name+' · '+when(p.shift.start),p.count)));app.append(preview,el('p','Расчёт плановых проверок. Клавиатуры по индивидуальному циклу и уборка после гостей считаются отдельно.','muted'));
 const grid=el('div',undefined,'admin-grid');adminCatalog.tasks.forEach(entry=>{const t=entry.task,c=el('section',undefined,'card'),changed=JSON.stringify(t)!==JSON.stringify(entry.current);c.append(el('span',t.active?'Включено':'Отключено','badge'),el('h2',t.title),el('p',t.zone+' · '+t.frequency+' · '+t.shift),el('small',t.id==='CLN-007'?'Подпункты добавляются к санузлу':t.steps.length+' подпунктов · '+photoDefault(t)+' фото'));if(changed)c.append(el('p','Есть изменения со следующей смены','good'));c.append(button('Редактировать',()=>editRule(entry)));grid.append(c);});app.append(grid);
}
function photoDefault(t){return Number.isInteger(t.photoCount)?t.photoCount:t.id==='CLN-006'?3:['CLN-012','CLN-013','CLN-031'].includes(t.id)?2:t.photo?1:0;}
function editRule(entry){
 const t=entry.task;app.replaceChildren();app.append(button('← К редактору',()=>renderCabinet()),el('h2',t.title),el('p','Применение со следующей смены: '+when(adminCatalog.effectiveAt),'notice'));
 const fields={},form=el('div',undefined,'editor-form');
 function field(key,label,value,options){const wrap=el('label',label),input=el(options?'select':['steps','standard','note'].includes(key)?'textarea':'input');if(options){[...new Set([...options,value])].forEach(v=>{const o=el('option',v);input.append(o);});}else input.type=key==='anchor'?'date':['photoCount','days','keyboardShifts'].includes(key)?'number':'text';input.value=value;fields[key]=input;wrap.append(input);form.append(wrap);}
 field('title','Название',t.title);field('zone','Зона',t.zone);field('active','Активность',t.active?'Включено':'Отключено',['Включено','Отключено']);field('shift','Смена',t.shift,['Обе','Дневная','Ночная']);
 field('frequency','Периодичность',t.frequency,['Каждая смена','Каждый день','Каждые 2 часа','Каждые 3 часа','Каждые 4 часа','Каждые 6 часа','После каждого гостя','Через день','Каждые 3 дня','Еженедельно','Раз в 3 недели','Раз в месяц']);
 field('deadline','Срок: Начало смены / Конец смены / ЧЧ:ММ',t.deadline||'Конец смены');field('photoCount','Обязательных фото (0–6)',photoDefault(t));field('days','Интервал дней',t.days||0);field('anchor','Дата начала цикла',t.anchor||'');
 if(t.id==='CLN-012'){field('keyboardShifts','Цикл клавиатур: 2 или 3 смены',t.keyboardShifts||2);app.append(el('p','Уже назначенные клавиатуры сохраняют срок. Новый цикл применяется к следующим заданиям.','muted'));}
 field('steps','Подпункты — по одному на строку',t.steps.join('\n'));field('standard','Как должен выглядеть результат',t.standard||'');field('note','Подсказка сотруднику',t.note||'');app.append(form);
 function readForm(){const input=Object.fromEntries(Object.entries(fields).map(([k,v])=>[k,v.value]));input.active=input.active==='Включено';input.steps=input.steps.split('\n').map(s=>s.trim()).filter(Boolean);return input;}
 const estimate=el('div',undefined,'notice');estimate.hidden=true;app.append(button('Посчитать нагрузку до сохранения',async()=>{const result=await rpc('adminPreview',{id:t.id,task:readForm()});estimate.hidden=false;estimate.textContent=result.map(p=>{const item=p.entries.find(x=>x.id===t.id);return p.shift.name+' '+when(p.shift.start)+': '+p.count+' плановых проверок всего; это задание: '+(item?(item.count===null?item.note:item.count):'отключено');}).join(' · ');}),estimate);
 app.append(button('Сохранить со следующей смены',async()=>{const input=readForm();const result=await rpc('adminSave',{id:t.id,revision:entry.revision,effectiveAt:adminCatalog.effectiveAt,task:input});adminCatalog=await rpc('adminCatalog');renderCabinet();message('Сохранено. Вступит в силу '+when(result.effectiveAt));},'primary'));
}

async function beginShift(){
 try{await rpc('claimShift',{start:state.shift.start});}catch(e){await refresh();throw e;}
 await refresh();message('Смена закреплена за вами. Уведомление руководителю поставлено в отправку.');
}
function renderShiftStart(){
 const a=state.assignment,card=el('section',undefined,'card');
 card.append(el('h2',a?(a.user===state.user.id?'Вы отвечаете за эту смену':'Смена уже начата'):'Начало смены'));
 if(a)card.append(el('p','Ответственный: '+a.name+(a.username?' · @'+a.username:'')));
 else{card.append(el('p','Нажмите, когда приступаете к работе. Первому нажавшему назначаются ответственность и баллы за эту смену.','muted'),button('Начать смену',beginShift,'primary'));}
 app.append(card);
}
let pointData;
function appendPointRows(score,container){
 const grid=el('div',undefined,'admin-grid');score.rows.forEach(r=>{const c=el('section',undefined,'card');c.append(el('strong',(r.points>0?'+':'')+r.points+' баллов'),el('h2',r.title),el('p',r.object),el('p',r.status,'muted'));if(r.performer)c.append(el('small','Отчёт: '+r.performer));grid.append(c);});container.append(grid);
 score.adjustments?.forEach(a=>{const c=el('section',undefined,'card');c.append(el('strong',(a.amount>0?'+':'')+a.amount+' · корректировка'),el('p',a.reason),el('small',when(a.at)));container.append(c);});
}
async function showMyPoints(){
 const score=await rpc('myPoints');app.replaceChildren();app.append(button('← К заданиям',()=>renderList()),el('h2','Мои баллы за смену'));
 app.append(el('p',score.assignment?'Ответственный: '+score.assignment.name:'Ответственный пока не назначен'));
 if(score.reason)app.append(el('p',score.reason,'notice'));
 if(!score.assignment)app.append(button('Начать смену',beginShift,'primary'));
 if(score.total!==null&&score.total!==undefined){app.append(metric('Текущий результат',score.total),el('p','На проверке: '+score.pending+'. Баллы изменятся после решения руководителя.','notice'));appendPointRows(score,app);}
}
function renderPoints(){
 if(!pointData){app.append(button('Загрузить баллы',async()=>{pointData=await rpc('adminPoints',{start:adminStart});renderCabinet();}));return;}
 const d=pointData,s=d.score,st=d.shift.start;
 app.append(el('h2','Учёт баллов: '+d.shift.name+' · '+when(st)),el('p','Один ответственный за смену. Баллы — основание для вашего решения о премии; выплаты автоматически не рассчитываются.','notice'));
 app.append(button('Назначить ответственного на следующую смену',async()=>{pointData=await rpc('adminPoints',{start:d.nextStart});renderCabinet();}));
 if(s.reason)app.append(el('p',s.reason,'notice'));
 if(s.enabledAt)app.append(el('p','Начало учёта: '+when(s.enabledAt)+'. Более ранние смены не штрафуются.','muted'));
 if(s.assignment)app.append(el('h2','Ответственный: '+s.assignment.name));
 if(s.total!==null){const totals=el('div',undefined,'metrics');totals.append(metric('Итого баллов',s.total),metric('За задания',s.base),metric('Отчётов на проверке',s.pending));app.append(totals);}
 const assignment=el('section',undefined,'card'),person=el('select'),reason=el('input');
 d.staff.forEach(u=>{const o=el('option',u.name);o.value=u.id;person.append(o);});if(s.assignment)person.value=s.assignment.user;person.setAttribute('aria-label','Ответственный сотрудник');reason.placeholder='Причина замены или назначения за прошедшую смену';
 assignment.append(el('h2','Ответственный за эту смену'),person,reason,button('Сохранить ответственного',async()=>{await rpc('adminAssign',{start:st,user:person.value,reason:reason.value});pointData=await rpc('adminPoints',{start:st});renderCabinet();message('Ответственный сохранён.');}));app.append(assignment);
 const rules=el('details',undefined,'card');rules.append(el('summary','Настроить стоимость заданий · со следующей смены'));const inputs={};
 [['regular','Принятое плановое задание'],['extra','Принятое дополнительное'],['penalty','Списание за невыполненное плановое']].forEach(([key,label])=>{const wrap=el('label',label),input=el('input');input.type='number';input.min=0;input.max=1000;input.value=d.nextRules[key];inputs[key]=input;wrap.append(input);rules.append(wrap);});rules.append(el('p','Новые значения действуют с '+when(d.rulesAt)+'. Ожидание проверки и невыполненные допзадания — без штрафа.','muted'),button('Сохранить правила баллов',async()=>{await rpc('adminPointRules',Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value])));pointData=await rpc('adminPoints',{start:st});renderCabinet();message('Правила баллов сохранены со следующей смены.');}));app.append(rules);
 if(s.assignment){
  const correction=el('details',undefined,'card');correction.append(el('summary','Корректировка баллов с объяснением'));const amount=el('input'),why=el('textarea');amount.type='number';amount.placeholder='Например: 10 или -10';why.placeholder='Причина обязательна: замена, технический сбой, согласованное исключение';correction.append(amount,why,button('Записать корректировку',async()=>{await rpc('adminPointAdjustment',{start:st,amount:amount.value,reason:why.value});pointData=await rpc('adminPoints',{start:st});renderCabinet();message('Корректировка записана в журнал.');}));app.append(correction);
  if(st===adminData.latest){const extra=el('details',undefined,'card');extra.append(el('summary','Согласовать дополнительное задание'));const title=el('input'),steps=el('textarea'),photos=el('input'),standard=el('textarea');title.placeholder='Что сделать';steps.placeholder='Подпункты — по одному на строке';photos.type='number';photos.min=0;photos.max=6;photos.value=1;standard.placeholder='Ожидаемый результат';extra.append(title,steps,el('label','Обязательных фото'),photos,standard,button('Выдать допзадание до конца смены',async()=>{await rpc('adminExtraTask',{start:st,title:title.value,steps:steps.value,photos:photos.value,standard:standard.value});await openCabinet();message('Допзадание выдано. Баллы начислятся после принятия отчёта.');},'primary'));app.append(extra);}
 }
 app.append(el('h2','За что начислены и сняты баллы'));appendPointRows(s,app);
 if(!s.rows.length)app.append(el('p','Начислений по заданиям пока нет.','muted'));
}

action(refresh);
